  <title>Ceramic resonator with load capacitors</title>
  <desc>Three-terminal ceramic resonator with two integrated load capacitors. The lower common terminal joins the capacitors; the resonating element connects the left and right terminals. The dashed boundary groups the internal elements.</desc>
