<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Browse Schematica's electronic symbol library.">
  <title>Schematica — Symbols</title>
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#library-heading">Skip to symbols</a>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Schematica home"><span class="brand-mark" aria-hidden="true">S</span>schematica</a>
    <div class="topbar-actions">
      <button id="open-exports" class="quiet-button" disabled>Export library<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v5h14v-5"/></svg></button>
      <button id="theme-toggle" class="icon-button" aria-label="Switch to light mode" title="Switch to light mode"><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14A9 9 0 0 1 10 3.5 9 9 0 1 0 20.5 14Z"/></svg></button>
    </div>
  </header>
  <main>
    <section class="catalogue" aria-labelledby="library-heading">
      <h1 id="library-heading" tabindex="-1">Symbols</h1>
      <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" type="search" placeholder="Search symbols" aria-label="Search symbols" autocomplete="off" disabled><kbd>/</kbd></label>
      <div class="filters" role="group" aria-label="Filter by type"><button data-filter="all" class="active" aria-pressed="true" disabled>All</button><button data-filter="passive" aria-pressed="false" disabled>Passive</button><button data-filter="active" aria-pressed="false" disabled>Amplifiers</button></div>
      <div class="cards" id="cards" aria-label="Symbols" aria-busy="true"></div>
      <p id="empty" class="empty" role="status" hidden>No matching symbols.</p>
      <p id="load-error" class="error" role="alert" hidden></p>
      <noscript><p class="error">Enable JavaScript to browse the library.</p></noscript>
    </section>
    <section class="inspector" aria-labelledby="symbol-name" aria-busy="true">
      <div class="inspector-heading"><h2 id="symbol-name">EU resistor</h2><a id="download-svg" class="icon-button" aria-label="Export symbol as SVG" title="Export symbol as SVG" aria-disabled="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v5h14v-5"/></svg></a></div>
      <div class="preview"><div id="canvas" aria-label="Symbol preview"></div><div class="preview-footer"><span>1 mm</span><label class="toggle"><input id="grid-toggle" type="checkbox" checked> Grid &amp; pins</label></div></div>
      <div class="settings">
        <fieldset disabled><legend>Size</legend><div class="segmented" id="sizes"><button data-size="small">Small</button><button data-size="medium" class="active">Medium</button><button data-size="large">Large</button></div></fieldset>
        <fieldset disabled><legend>Stroke</legend><div class="segmented strokes" id="strokes"><button data-stroke="thin"><i class="thin" aria-hidden="true"></i>Thin</button><button data-stroke="medium" class="active"><i class="medium" aria-hidden="true"></i>Medium</button><button data-stroke="thick"><i class="thick" aria-hidden="true"></i>Thick</button></div></fieldset>
      </div>
      <details class="description"><summary>Description</summary><p id="description"></p><h3>Keywords</h3><ul id="keywords" class="tags" aria-label="Search keywords"></ul></details>
    </section>
  </main>
  <dialog id="export-dialog" aria-labelledby="export-title">
    <div class="dialog-header"><h2 id="export-title">Export library</h2><button id="close-dialog" class="icon-button" aria-label="Close export options"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
    <p id="export-summary"></p>
    <p class="export-format">Inkscape Symbols · SVG</p>
    <a id="download-library" class="download-button">Download SVG<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v5h14v-5"/></svg></a>
  </dialog>
</body>
</html>
